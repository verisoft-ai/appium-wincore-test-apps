# Local SAP NetWeaver AS ABAP 7.52 (SP01/SP04) Developer Edition — for testing the
# driver's SAP GUI Scripting subsystem (csharp/DesktopDriverServer/Sap/).
#
# This is the light, ASE-based ABAP trial (SID NPL) — ~6 GB RAM, ~80 GB disk — as
# opposed to the HANA-based `sapse/abap-cloud-developer-trial` which needs 24 GB RAM.
#
# Two ways to get an image (set SAP_ABAP_IMAGE in sap/.env):
#   1. Community prebuilt (fast, no SAP login):  yoraco/sap-dev-edition-7.52-sp04
#      → still requires running ./install.sh once inside the container.
#   2. Build your own from official archives:    see sap/README.md "Build route"
#      → docker build -t nwabap:7.52 .  then set SAP_ABAP_IMAGE=nwabap:7.52
#
# First-time setup, licensing, and the client/server scripting switches are all in
# sap/README.md. After the one-time install this file is all you need:
#   docker compose -f sap/docker-compose.yml up -d
#   docker compose -f sap/docker-compose.yml exec abap /sap/start.sh   # start SAP
#
services:
  abap:
    image: ${SAP_ABAP_IMAGE:-yoraco/sap-dev-edition-7.52-sp04}
    container_name: nwabap752
    # Hostname MUST be vhcalnplci — the ABAP/ASE install is bound to it and will
    # not start under any other name.
    hostname: vhcalnplci
    # SAP GUI dispatcher (3200), gateway (3300), ICM http/https (8000/44300).
    ports:
      - "3200:3200"
      - "3300:3300"
      - "8000:8000"
      - "44300:44300"
    # ASE + ABAP fit in ~6 GB; give it headroom but stay well under the host's 15.7 GB
    # so Windows + WSL2 don't thrash.
    mem_limit: 10g
    shm_size: 2g
    # ASE needs a high mmap count or it fails to start.
    sysctls:
      vm.max_map_count: "2000000"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    stop_grace_period: 20m
    # Keep the container alive; SAP itself is started/stopped via sap/start.sh /
    # sap/stop.sh (or the install script on first run). An empty `tail` is the
    # simplest "stay up" entrypoint that survives `docker compose up -d`.
    stdin_open: true
    tty: true
    command: ["tail", "-f", "/dev/null"]
    volumes:
      # Persist the SAP + ASE data across container recreation. First install
      # populates these; later `up` reuses them.
      - abap_sapmnt:/sapmnt
      - abap_usrsap:/usr/sap
      - abap_sybase:/sybase
      # Helper scripts (start.sh / stop.sh / enable-scripting.sh).
      - ./scripts:/sap:ro

volumes:
  abap_sapmnt:
  abap_usrsap:
  abap_sybase:
